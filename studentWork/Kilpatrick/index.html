<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border-Radius</title>
<style>
        *{
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .box {
            width: 200px;
            height: 200px;
            background-color: #3498db;
            border-radius: 40px; 
            
            display: flex;
            align-items: center;
            justify-content: center;
         
        }
        .innerBox {
            width: 150px;
            height: 150px;
            background-color: #e74c3c;
            border-radius: 20px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .secondbox {
            width: 120px;
            height: 120px;
            background-color: #2ecc71;
            border-radius: 5px; 
            
        }
    </style>


</head>
<body>
    <div class="box">
        <div class="innerBox"><div class="secondbox"></div></div>
        
    </div>
</body>
</html>
